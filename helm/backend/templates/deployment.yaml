apiVersion: apps/v1
kind: Deployment
metadata:
  name: cisb-referral-backend
  labels:
    app.kubernetes.io/name: cisb-referral-backend
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cisb-referral-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cisb-referral-backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: github-docker-registry
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["npx", "prisma", "migrate", "deploy"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crunchySecret }}
                  key: uri
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: cisb-referral-backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: {{ .Values.nodeEnv | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crunchySecret }}
                  key: pgbouncer-host
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crunchySecret }}
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crunchySecret }}
                  key: password
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crunchySecret }}
                  key: pgbouncer-port
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crunchySecret }}
                  key: dbname
            - name: PGBOUNCER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crunchySecret }}
                  key: pgbouncer-uri
                  optional: true
            - name: ADMIN_KC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: ADMIN_KC_ISSUER_URL
            - name: ADMIN_KC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: ADMIN_KC_AUDIENCE
            - name: REFERRAL_KC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: REFERRAL_KC_ISSUER_URL
            - name: REFERRAL_KC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: REFERRAL_KC_AUDIENCE
            - name: MAIL_ENABLED
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: MAIL_ENABLED
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: SMTP_PORT
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: SMTP_SECURE
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: SMTP_FROM
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: SMTP_PASSWORD
                  optional: true
            - name: ADMIN_APP_URL
              valueFrom:
                secretKeyRef:
                  name: cisb-referral-backend-secrets
                  key: ADMIN_APP_URL
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
