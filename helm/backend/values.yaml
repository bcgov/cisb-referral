replicaCount: 1

image:
  repository: ghcr.io/bcgov/cisb-referral-backend
  tag: main
  pullPolicy: Always

# Application runtime env (override per environment via Helm --set)
nodeEnv: production
logLevel: info

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Crunchy PostgreSQL secret created by PGO operator
# Format: <fullnameOverride>-pguser-<username>
crunchySecret: crunchy-postgres-pguser-referral-app-user

# Horizontal Pod Autoscaler configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

# Container resource requests and limits
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
