replicaCount: 1

image:
  repository: ghcr.io/bcgov/cisb-referral-admin-app
  tag: main
  pullPolicy: Always

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

route:
  host: ""
  ipWhitelist: "142.22.0.0/16 142.23.0.0/16 142.24.0.0/16 142.25.0.0/16 142.26.0.0/16 142.27.0.0/16 142.28.0.0/16 142.29.0.0/16 142.30.0.0/16 142.31.0.0/16 142.32.0.0/16 142.33.0.0/16 142.35.0.0/16 142.36.0.0/16"
  tls:
    certificate: ""
    key: ""
    caCertificate: ""

# Container resource requests and limits
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Config for the frontend (API endpoints, etc.)
config:
  BACKEND_URL: "http://cisb-referral-backend:80"
  KC_URL: ""
