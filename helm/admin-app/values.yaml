replicaCount: 1

image:
  repository: ghcr.io/bcgov/cisb-referral-admin-app
  tag: main
  pullPolicy: Always

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

route:
  host: ""
  tls:
    certificate: ""
    key: ""
    caCertificate: ""

# Container resource requests and limits
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Config for the frontend (API endpoints, etc.)
config:
  BACKEND_URL: "http://cisb-referral-backend:80"
  KC_URL: ""
