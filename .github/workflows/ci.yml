name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run tests & collect coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            admin-app/package-lock.json
            referral-app/package-lock.json
            backend/package-lock.json
            database/package-lock.json

      - name: Install deps (admin-app)
        working-directory: admin-app
        run: npm ci --prefer-offline --no-audit

      - name: Install deps (referral-app)
        working-directory: referral-app
        run: npm ci --prefer-offline --no-audit

      - name: Install deps (backend)
        working-directory: backend
        run: npm ci --prefer-offline --no-audit

      - name: Install deps (database)
        working-directory: database
        run: npm ci --prefer-offline --no-audit

      - name: Run tests w/ coverage (admin-app)
        working-directory: admin-app
        env:
          CI: true
          NODE_ENV: test
        run: npm run test:coverage --if-present

      - name: Run tests w/ coverage (referral-app)
        working-directory: referral-app
        env:
          CI: true
          NODE_ENV: test
        run: npm run test:coverage --if-present

      - name: Run tests w/ coverage (backend)
        working-directory: backend
        env:
          CI: true
          NODE_ENV: test
        run: npm run test:cov --if-present

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            admin-app/coverage/lcov.info
            referral-app/coverage/lcov.info
            backend/coverage/lcov.info
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
