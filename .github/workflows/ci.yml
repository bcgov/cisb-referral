name: CI & Build
permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    name: Run tests & collect coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            admin-app/package-lock.json
            referral-app/package-lock.json
            backend/package-lock.json

      - name: Install deps (admin-app)
        working-directory: admin-app
        run: npm ci --prefer-offline --no-audit

      - name: Install deps (referral-app)
        working-directory: referral-app
        run: npm ci --prefer-offline --no-audit

      - name: Install deps (backend)
        working-directory: backend
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client (backend)
        working-directory: backend
        run: npm run prisma:generate

      - name: Run tests w/ coverage (admin-app)
        working-directory: admin-app
        env:
          CI: true
          NODE_ENV: test
        run: npm run test:coverage --if-present

      - name: Run tests w/ coverage (referral-app)
        working-directory: referral-app
        env:
          CI: true
          NODE_ENV: test
        run: npm run test:coverage --if-present

      - name: Run tests w/ coverage (backend)
        working-directory: backend
        env:
          CI: true
          NODE_ENV: test
        run: npm run test:cov --if-present

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            admin-app/coverage/lcov.info
            referral-app/coverage/lcov.info
            backend/coverage/lcov.info
          if-no-files-found: ignore

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports
          path: .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_and_push:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for admin-app
        id: meta-admin-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-app
          tags: |
            type=sha,prefix=sha-,format=long

      - name: Build and push admin-app image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-app
          file: ./admin-app/Dockerfile
          push: true
          tags: ${{ steps.meta-admin-app.outputs.tags }}
          labels: ${{ steps.meta-admin-app.outputs.labels }}

      - name: Extract metadata for referral-app
        id: meta-referral-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-referral-app
          tags: |
            type=sha,prefix=sha-,format=long

      - name: Build and push referral-app image
        uses: docker/build-push-action@v5
        with:
          context: ./referral-app
          file: ./referral-app/Dockerfile
          push: true
          tags: ${{ steps.meta-referral-app.outputs.tags }}
          labels: ${{ steps.meta-referral-app.outputs.labels }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=sha-,format=long

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

    outputs:
      image_tag: sha-${{ github.sha }}
