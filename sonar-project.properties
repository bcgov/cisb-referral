sonar.projectKey=bcgov_cisb-referral
sonar.organization=bcgov-sonarcloud
sonar.projectName=cisb-referral

# Multi-module monorepo configuration
sonar.modules=admin-app,referral-app,backend

# Shared settings
sonar.sourceEncoding=UTF-8
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/main.tsx

# Coverage exclusions - bootstrap files with no testable logic
sonar.coverage.exclusions=**/main.tsx

# --- admin-app ---
admin-app.sonar.sources=src
admin-app.sonar.tests=src/__tests__
admin-app.sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Admin and referral apps intentionally share similar patterns
admin-app.sonar.cpd.exclusions=src/**

# --- referral-app ---
referral-app.sonar.sources=src
referral-app.sonar.tests=src/__tests__
referral-app.sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Admin and referral apps intentionally share similar patterns
referral-app.sonar.cpd.exclusions=src/**

# --- backend ---
backend.sonar.sources=src
backend.sonar.tests=src
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

