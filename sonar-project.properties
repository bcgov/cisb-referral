sonar.projectKey=bcgov_cisb-referral
sonar.organization=bcgov-sonarcloud
sonar.projectName=cisb-referral

# Path to sources
sonar.sources=admin-app/src,referral-app/src,backend/src

# Path to tests
sonar.tests=backend/src,admin-app/src/__tests__,referral-app/src/__tests__
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/main.tsx

# Coverage exclusions - bootstrap files with no testable logic
sonar.coverage.exclusions=**/main.tsx

# Duplicate code detection exclusions
# Admin and referral apps are separate applications that intentionally share similar patterns
sonar.cpd.exclusions=admin-app/src/**,referral-app/src/**

# Coverage reports (lcov format)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,admin-app/coverage/lcov.info,referral-app/coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

